<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài thơ bốn mùa</title>
</head>
<body>
    <br>
    <table width="640" bgcolor="#FFFDE7" border="1" bodercolor="#9E9E9E" cellpadding="24" cellspacing="0" align="center">
        <tr>
            <td align="center">
                <table width="100%" border="0" bgcolor="#FFD9E6" cellpadding="6" cellspacing="0">
                    <tr>
                        <td align="center">
                            <font color="#D40000" size="5">BỐN MÙA</font>
                        </td>
                    </tr>
                </table>
                <p>
                    <font color="#0033CC">
                        <i>
                            Xuân về hoa nở khắp trời<br>
                            Hạ sang nắng cháy rạng ngời phố quen<br>
                            Thu về lá rụng bên thềm
                        </i>
                    </font>
                </p>
                <hr width="55%" color="#0033CC" size="1">
                <p>
                    <i>
                        <font color="#D40000">
                            Đông sang gió lạnh bên em chờ đợi<br>
                            Bốn mùa là bốn giấc mơ<br>
                            Thời gian đi mãi ta chờ đợi ai
                        </font>
                    </i>
                </p>
                <hr width="55%" color="#0033CC" size="1">
                <p>
                    <i>
                        <font color="#0033CC">
                            Một năm rồi lại một năm<br>
                            Vẫn còn câu hát thì thầm quê hương<br>
                            Chờ xuân nắng mới soi đường
                        </font>
                    </i>
                </p>
            </td>
        </tr>
    </table>
</body>
</html>
